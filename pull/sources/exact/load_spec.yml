load:
  file_format: parquet
  partitioning: none

  # Output path convention:
  # bronze/exact/<endpoint>.parquet
  output_path_template: "bronze/exact/{endpoint}.parquet"

  api:
    base_url: "https://start.exactonline.nl/api/v1"
    authentication: "oauth2"
    rate_limit: "respect-source-defaults"

  extractor:
    mode: "full"                # reset loads allowed this sprint
    endpoint_source: "endpoints.yml"
    field_source: "fields.yml"
