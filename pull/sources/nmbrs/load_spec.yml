load:
  file_format: parquet
  partitioning: none

  # Output path convention:
  # bronze/nmbrs/<endpoint>.parquet
  output_path_template: "bronze/nmbrs/{endpoint}.parquet"

  api:
    base_url: "https://api.nmbrs.nl/v3"
    authentication: "api_key"
    rate_limit: "respect-source-defaults"

  extractor:
    mode: "full"                # reset loads allowed this sprint
    endpoint_source: "endpoints.yml"
    field_source: "fields.yml"
